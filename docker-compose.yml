version: "3.9"

services:
  web:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - backend/.env
    depends_on:
      - redis
    volumes:
      - media_data:/app/backend/media
      - static_data:/app/backend/staticfiles
    restart: unless-stopped

  celery-worker:
    build: .
    command: celery -A config worker -l info
    env_file:
      - backend/.env
    depends_on:
      - redis
    restart: unless-stopped

  celery-beat:
    build: .
    command: celery -A config beat -l info
    env_file:
      - backend/.env
    depends_on:
      - redis
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  media_data:
  static_data:
  redis_data:
