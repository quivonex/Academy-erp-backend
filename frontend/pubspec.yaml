name: edusphere_admin
description: EduSphere ERP — Enterprise Admin & Faculty Workspace (Flutter)
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1

  # Routing
  go_router: ^14.2.0

  # Networking
  dio: ^5.4.3+1

  # Secure token storage
  flutter_secure_storage: ^9.2.2

  # Fonts matching DESIGN.md (Plus Jakarta Sans + Inter)
  google_fonts: ^6.2.1

  # KPI charts / sparklines
  fl_chart: ^0.68.0

  # Locale-aware currency/date formatting (tabular-nums friendly)
  intl: ^0.19.0
  firebase_core: ^4.15.0

  # URL launcher
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
