<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Password Reset</title>
</head>
<body style="margin:0;padding:0;font-family:Arial,Helvetica,sans-serif;background:#f4f4f7;">
<table width="100%" cellpadding="0" cellspacing="0" style="background:#f4f4f7;padding:40px 0;">
<tr><td align="center">
<table width="560" cellpadding="0" cellspacing="0" style="background:#ffffff;border-radius:8px;overflow:hidden;">
  <tr><td style="background:#1a1a2e;padding:24px 32px;">
    <h1 style="color:#ffffff;margin:0;font-size:20px;">{{ firm_name }}</h1>
  </td></tr>
  <tr><td style="padding:32px;">
    <p style="color:#333;font-size:16px;line-height:1.6;margin:0 0 16px;">Hello {{ user_name }},</p>
    <p style="color:#333;font-size:16px;line-height:1.6;margin:0 0 24px;">You requested a password reset. Use the OTP below to reset your password:</p>
    <div style="background:#f4f4f7;border-radius:8px;padding:20px;text-align:center;margin:0 0 24px;">
      <span style="font-size:32px;font-weight:bold;letter-spacing:8px;color:#1a1a2e;">{{ otp }}</span>
    </div>
    <p style="color:#666;font-size:14px;line-height:1.6;margin:0 0 8px;">This OTP expires in {{ expiry_minutes }} minutes.</p>
    <p style="color:#666;font-size:14px;line-height:1.6;margin:0;">If you did not request this reset, please ignore this email.</p>
  </td></tr>
  <tr><td style="background:#f4f4f7;padding:16px 32px;text-align:center;">
    <p style="color:#999;font-size:12px;margin:0;">&copy; {{ year }} {{ firm_name }}. All rights reserved.</p>
  </td></tr>
</table>
</td></tr>
</table>
</body>
</html>
